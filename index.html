<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* সম্পূর্ণ পেজকে সাদা এবং একনাগাড়ে রাখার জন্য মূল ডিজাইন */
        html, body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            width: 100%;
        }
        #pdf-container {
            width: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
        }
        .page-container {
            position: relative;
            width: 100%;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        /* টেক্সট এবং লিংক লেয়ারের জন্য নিজস্ব মিনিমাল সিএসএস (কোনো কালো ব্যাকগ্রাউন্ড বা বর্ডার আসবে না) */
        .textLayer {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: top left;
            z-index: 2;
            opacity: 1;
            line-height: 1.0;
        }
        .textLayer span {
            color: transparent;
            position: absolute;
            white-space: pre;
            transform-origin: 0% 0%;
            cursor: text;
        }
        .textLayer ::selection {
            background: rgba(0, 0, 255, 0.2);
        }

        .annotationLayer {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: top left;
            z-index: 3;
        }
        .annotationLayer a {
            position: absolute;
            background-color: rgba(255, 255, 255, 0);
            cursor: pointer;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>

    <div id="pdf-container"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const url = 'document.pdf';
        const container = document.getElementById('pdf-container');

        pdfjsLib.getDocument(url).promise.then(async pdf => {
            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                const page = await pdf.getPage(pageNum);
                
                // উচ্চ রেজোলিউশন (Scale 3) যাতে জুম করলে বিন্দুমাত্র না ফাটে
                const scale = 3; 
                const viewport = page.getViewport({ scale: scale });

                // প্রতিটি পেজের জন্য আলাদা কন্টেইনার
                const pageContainer = document.createElement('div');
                pageContainer.className = 'page-container';
                container.appendChild(pageContainer);

                // ১. ব্যাকগ্রাউন্ডে হাই-কোয়ালিটি পিডিএফ পেজ ড্র করা
                const canvas = document.createElement('canvas');
                pageContainer.appendChild(canvas);
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                await page.render({ canvasContext: context, viewport: viewport }).promise;

                // ২. টেক্সট লেয়ার তৈরি (যাতে টেক্সট সিলেক্ট ও কপি করা যায়)
                const textLayerDiv = document.createElement('div');
                textLayerDiv.className = 'textLayer';
                textLayerDiv.style.width = viewport.width + 'px';
                textLayerDiv.style.height = viewport.height + 'px';
                pageContainer.appendChild(textLayerDiv);

                const textContent = await page.getTextContent();
                pdfjsLib.renderTextLayer({
                    textContent: textContent,
                    container: textLayerDiv,
                    viewport: viewport,
                    textDivs: []
                });

                // ৩. লিংক লেয়ার তৈরি (যাতে পিডিএফ-এর লিংকে ক্লিক করা যায়)
                const annotationLayerDiv = document.createElement('div');
                annotationLayerDiv.className = 'annotationLayer';
                annotationLayerDiv.style.width = viewport.width + 'px';
                annotationLayerDiv.style.height = viewport.height + 'px';
                pageContainer.appendChild(annotationLayerDiv);

                const annotations = await page.getAnnotations();
                pdfjsLib.AnnotationLayer.render({
                    viewport: viewport.clone({ dontFlip: true }),
                    div: annotationLayerDiv,
                    annotations: annotations,
                    page: page,
                    linkService: {
                        getAnchorUrl: (hash) => hash,
                        navigateTo: (dest) => {},
                        getDestinationHash: (dest) => '#',
                        executeNamedAction: (action) => {},
                        cachePageRef: () => {},
                        isPageVisible: () => true
                    }
                });

                // মোবাইল ও ল্যাপটপের ফুল স্ক্রিনের সাথে লেয়ারগুলো নিখুঁতভাবে মেলানোর ফাংশন
                function adjustLayers() {
                    const ratio = pageContainer.clientWidth / viewport.width;
                    textLayerDiv.style.transform = `scale(${ratio})`;
                    annotationLayerDiv.style.transform = `scale(${ratio})`;
                }
                
                adjustLayers();
                window.addEventListener('resize', adjustLayers);
            }
        }).catch(error => {
            console.error('Error: ', error);
        });
    </script>

</body>
</html>
