<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <title>PDF Viewer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf_viewer.min.css">
    <style>
        /* শর্ত ১ ও ৩: সম্পূর্ণ ব্যাকগ্রাউন্ড ধবধবে সাদা এবং কোনো বাড়তি আইকন বা কালো অংশ থাকবে না */
        html, body {
            margin: 0;
            padding: 0;
            background-color: #ffffff !important;
            width: 100%;
        }
        #pdf-container {
            width: 100%;
            background-color: #ffffff !important;
            display: flex;
            flex-direction: column;
        }
        /* শর্ত ২: পেজের মাঝখানের সব দাগ, বর্ডার ও শ্যাডো পুরোপুরি রিমুভ করা হলো */
        .page-container {
            position: relative;
            width: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            box-shadow: none !important;
            background-color: #ffffff !important;
            overflow: hidden;
        }
        canvas {
            width: 100% !important;
            height: auto !important;
            display: block;
        }
        /* লেখা এবং লিংক যেন একদম নিখুঁত জায়গায় বসে */
        .textLayer, .annotationLayer {
            opacity: 1;
            transform-origin: top left;
        }
        .pdfViewer .page {
            border: none !important;
            box-shadow: none !important;
            margin: 0 !important;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>

    <div id="pdf-container"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const url = 'document.pdf';
        const container = document.getElementById('pdf-container');

        pdfjsLib.getDocument(url).promise.then(async (pdf) => {
            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                const page = await pdf.getPage(pageNum);
                
                // লেখা ঝাপসা হওয়া বন্ধ করতে হাই-রেজোলিউশন স্কেল (2.5) ব্যবহার করা হয়েছে
                const scale = 2.5; 
                const viewport = page.getViewport({ scale: scale });

                // প্রতিটি পেজের কন্টেইনার তৈরি
                const pageContainer = document.createElement('div');
                pageContainer.className = 'page-container';
                container.appendChild(pageContainer);

                // ১. ক্রিস্টাল ক্লিয়ার পিডিএফ ব্যাকগ্রাউন্ড ড্র করা
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                pageContainer.appendChild(canvas);

                await page.render({ canvasContext: context, viewport: viewport }).promise;

                // ২. টেক্সট লেয়ার (লেখা সিলেক্ট বা কপি করার জন্য)
                const textLayerDiv = document.createElement('div');
                textLayerDiv.className = 'textLayer';
                textLayerDiv.style.width = viewport.width + 'px';
                textLayerDiv.style.height = viewport.height + 'px';
                pageContainer.appendChild(textLayerDiv);

                const textContent = await page.getTextContent();
                await pdfjsLib.renderTextLayer({
                    textContent: textContent,
                    container: textLayerDiv,
                    viewport: viewport,
                    textDivs: []
                });

                // ৩. লিংক লেয়ার (লেখার লিংকে ক্লিক করলে ব্রাউজার ওপেন হওয়ার জন্য)
                const annotationLayerDiv = document.createElement('div');
                annotationLayerDiv.className = 'annotationLayer';
                annotationLayerDiv.style.width = viewport.width + 'px';
                annotationLayerDiv.style.height = viewport.height + 'px';
                pageContainer.appendChild(annotationLayerDiv);

                const annotations = await page.getAnnotations();
                await pdfjsLib.AnnotationLayer.render({
                    viewport: viewport,
                    div: annotationLayerDiv,
                    annotations: annotations,
                    page: page,
                    linkService: {
                        getAnchorUrl: (hash) => hash,
                        navigateTo: (dest) => {},
                        getDestinationHash: (dest) => '#',
                        executeNamedAction: (action) => {},
                        cachePageRef: () => {},
                        isPageVisible: () => true
                    }
                });

                // মোবাইল স্ক্রিনের সাইজের সাথে লেখা ও লিংক নিখুঁতভাবে মেলানোর ফাংশন
                function adjustScale() {
                    const currentWidth = pageContainer.clientWidth;
                    const originalWidth = viewport.width;
                    const ratio = currentWidth / originalWidth;

                    textLayerDiv.style.transform = `scale(${ratio})`;
                    annotationLayerDiv.style.transform = `scale(${ratio})`;
                    pageContainer.style.height = (viewport.height * ratio) + 'px';
                }

                adjustScale();
                window.addEventListener('resize', adjustScale);
            }
        }).catch(error => {
            console.error('Error loading PDF: ', error);
        });
    </script>
</body>
</html>
