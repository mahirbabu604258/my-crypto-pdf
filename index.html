<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf_viewer.min.css">
    <style>
        /* শর্ত ১ ও ৩: সম্পূর্ণ ব্যাকগ্রাউন্ড সাদা এবং কোনো ফালতু আইকন বা কালো অংশ থাকবে না */
        html, body {
            margin: 0;
            padding: 0;
            background-color: #ffffff !important;
            width: 100%;
        }
        
        /* লাইব্রেরির নিজস্ব সমস্ত কালো/ধূসর ব্যাকগ্রাউন্ড মুছে সাদা করা হলো */
        .pdfViewer {
            background-color: #ffffff !important;
            background: #ffffff !important;
        }
        
        /* শর্ত ২: দুটি পেজের মাঝখানের ফাঁকা ভাগ, দাগ এবং শ্যাডো পুরোপুরি রিমুভ করা হলো */
        .pdfViewer .page {
            border: none !important;
            box-shadow: none !important;
            margin: 0 auto !important;
            padding: 0 !important;
            background-color: #ffffff !important;
            position: relative;
            transform-origin: top left;
        }

        /* পেজ দুটিকে একদম একসাথে জোড়া লাগিয়ে রাখার কন্টেইনার */
        .page-wrapper {
            width: 100%;
            overflow: hidden;
            background-color: #ffffff;
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
        }
        
        canvas {
            display: block;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>

    <div id="pdf-container" class="pdfViewer"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const url = 'document.pdf';
        const container = document.getElementById('pdf-container');

        pdfjsLib.getDocument(url).promise.then(async pdf => {
            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                const page = await pdf.getPage(pageNum);
                
                // জুম করলে যেন লেখা ক্রিস্টাল ক্লিয়ার থাকে (হাই রেজোলিউশন ৩)
                const scale = 3; 
                const viewport = page.getViewport({ scale: scale });

                // পেজ জোড়া রাখার র্যাপার
                const pageWrapper = document.createElement('div');
                pageWrapper.className = 'page-wrapper';
                container.appendChild(pageWrapper);

                // অফিশিয়াল পেজ লেআউট তৈরি
                const pageDiv = document.createElement('div');
                pageDiv.className = 'page';
                pageDiv.setAttribute('data-page-number', pageNum);
                pageDiv.style.width = viewport.width + 'px';
                pageDiv.style.height = viewport.height + 'px';
                pageWrapper.appendChild(pageDiv);

                // ১. আসল পিডিএফ ব্যাকগ্রাউন্ড ড্র করা
                const canvas = document.createElement('canvas');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                pageDiv.appendChild(canvas);
                
                const context = canvas.getContext('2d');
                await page.render({ canvasContext: context, viewport: viewport }).promise;

                // ২. টেক্সট লেয়ার (কপি করার জন্য)
                const textLayerDiv = document.createElement('div');
                textLayerDiv.className = 'textLayer';
                pageDiv.appendChild(textLayerDiv);

                const textContent = await page.getTextContent();
                await pdfjsLib.renderTextLayer({
                    textContent: textContent,
                    container: textLayerDiv,
                    viewport: viewport,
                    textDivs: []
                });

                // ৩. লিংক লেয়ার (লেখার লিংকে ক্লিক করলে ব্রাউজার ওপেন হওয়ার জন্য)
                const annotationLayerDiv = document.createElement('div');
                annotationLayerDiv.className = 'annotationLayer';
                pageDiv.appendChild(annotationLayerDiv);

                const annotations = await page.getAnnotations();
                await pdfjsLib.AnnotationLayer.render({
                    viewport: viewport.clone({ dontFlip: true }),
                    div: annotationLayerDiv,
                    annotations: annotations,
                    page: page,
                    linkService: {
                        getAnchorUrl: (hash) => hash,
                        navigateTo: (dest) => {},
                        getDestinationHash: (dest) => '#',
                        executeNamedAction: (action) => {},
                        cachePageRef: () => {},
                        isPageVisible: () => true
                    }
                });

                // মোবাইল স্ক্রিনের সাথে টেক্সট, লিংক এবং পেজ নিখুঁতভাবে মেলানোর ফাংশন
                function resizePage() {
                    const parentWidth = pageWrapper.clientWidth;
                    const ratio = parentWidth / viewport.width;
                    
                    // পুরো পেজ উপাদানটিকে একসাথে সমানুপাতিক হারে ছোট-বড় করা
                    pageDiv.style.transform = `scale(${ratio})`;
                    // পেজের মাঝখানের গ্যাপ বা ভাগ চিরতরে বন্ধ করার ফর্মুলা
                    pageWrapper.style.height = (viewport.height * ratio) + 'px';
                }

                resizePage();
                window.addEventListener('resize', resizePage);
            }
        }).catch(error => {
            console.error('Error: ', error);
        });
    </script>

</body>
</html>
