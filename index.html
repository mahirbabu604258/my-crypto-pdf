<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* আপনার পছন্দ হওয়া সেই ফুল স্ক্রিন ডিজাইন এবং আসল ব্যাকগ্রাউন্ড */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        object {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <object data="document.pdf#toolbar=0&navpanes=0&scrollbar=0" type="application/pdf">
        <embed src="document.pdf#toolbar=0&navpanes=0&scrollbar=0" type="application/pdf" />
    </object>

</body>
</html>
